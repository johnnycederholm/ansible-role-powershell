---
- name: Get latest release of a public repository
  community.general.github_release:
    user: Powershell
    repo: Powershell
    action: latest_release
    prerelease: true
  register: release
  when: powershell_version is not defined

- name: Download package
  ansible.builtin.get_url:
    url: https://github.com/Powershell/Powershell/releases/download/{{ release.tag }}/powershell_{{ release.tag[1:] }}-1.deb_amd64.deb
    dest: /tmp
    mode: "644"
  when: powershell_version is not defined

- name: Download package
  ansible.builtin.get_url:
    url: https://github.com/Powershell/Powershell/releases/download/v{{ powershell_version }}/powershell_{{ powershell_version }}-1.deb_amd64.deb
    dest: /tmp
    mode: "644"
  when: powershell_version is defined

- name: Install Powershell latest release
  ansible.builtin.apt:
    deb: /tmp/powershell_{{ release.tag[1:] }}-1.deb_amd64.deb
    state: present
  when: powershell_version is not defined

- name: Install Powershell {{ powershell_version }}
  ansible.builtin.apt:
    deb: /tmp/powershell_{{ powershell_version }}-1.deb_amd64.deb
    state: present
  when: powershell_version is defined
